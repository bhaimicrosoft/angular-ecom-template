<app-auth-shell badge="Free to join · No card required">
  <div class="mb-7 text-center">
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">
      Join <span class="text-gradient animate-gradient-text">Nova</span> today
    </h1>
    <p class="mt-2 text-sm text-muted-foreground">
      Already a member?
      <a routerLink="/login" class="font-semibold text-accent hover:underline">Sign in</a>
    </p>
  </div>

  <!-- Social -->
  <div class="grid grid-cols-3 gap-3">
    <button hlmBtn variant="outline" class="h-11 bg-background/40" (click)="social('google')" [disabled]="loading()" aria-label="Continue with Google">
      <svg viewBox="0 0 24 24" class="h-5 w-5"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.7-2.6C16.9 3.5 14.7 2.5 12 2.5 6.9 2.5 2.8 6.6 2.8 12S6.9 21.5 12 21.5c5.9 0 9.8-4.1 9.8-9.9 0-.7-.1-1.2-.2-1.7H12z"/></svg>
    </button>
    <button hlmBtn variant="outline" class="h-11 bg-background/40" (click)="social('apple')" [disabled]="loading()" aria-label="Continue with Apple">
      <svg viewBox="0 0 24 24" class="h-5 w-5 fill-foreground"><path d="M16.4 12.9c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.9-.8-3-.8-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.1 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2-1.1 2.8-2.2.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.8zM14.2 6.1c.6-.7 1-1.8.9-2.8-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.7-1 2.7 1 .1 2.1-.5 2.7-1.2z"/></svg>
    </button>
    <button hlmBtn variant="outline" class="h-11 bg-background/40" (click)="social('github')" [disabled]="loading()" aria-label="Continue with GitHub">
      <svg viewBox="0 0 24 24" class="h-5 w-5 fill-foreground"><path d="M12 2C6.5 2 2 6.6 2 12.3c0 4.5 2.9 8.4 6.8 9.7.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.4-3.4-1.4-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9 9 0 0 1 4.9 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5 3.9-1.3 6.8-5.2 6.8-9.7C22 6.6 17.5 2 12 2z"/></svg>
    </button>
  </div>

  <div class="my-6 flex items-center gap-4">
    <span class="h-px flex-1 bg-border"></span>
    <span class="text-xs font-medium uppercase tracking-wide text-muted-foreground">or</span>
    <span class="h-px flex-1 bg-border"></span>
  </div>

  @if (error()) {
    <div
      class="mb-5 flex items-start gap-2 rounded-xl border border-destructive/30 bg-destructive/10 px-4 py-3 text-sm text-destructive animate-fade-in"
    >
      <ng-icon name="lucideCircleAlert" size="18" class="mt-0.5 shrink-0" />
      <span>{{ error() }}</span>
    </div>
  }

  <form (ngSubmit)="submit()" class="space-y-4">
    <div class="space-y-2 animate-fade-up delay-100">
      <label hlmLabel for="name">Full name</label>
      <div class="group relative">
        <ng-icon
          name="lucideUser"
          size="18"
          class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted-foreground transition-colors group-focus-within:text-accent"
        />
        <input
          hlmInput
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          placeholder="Ada Lovelace"
          class="h-12 bg-background/50 pl-11"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
        />
      </div>
    </div>

    <div class="space-y-2 animate-fade-up delay-200">
      <label hlmLabel for="email">Email address</label>
      <div class="group relative">
        <ng-icon
          name="lucideMail"
          size="18"
          class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted-foreground transition-colors group-focus-within:text-accent"
        />
        <input
          hlmInput
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          class="h-12 bg-background/50 pl-11"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </div>
    </div>

    <div class="space-y-2 animate-fade-up delay-300">
      <label hlmLabel for="password">Password</label>
      <div class="group relative">
        <ng-icon
          name="lucideLock"
          size="18"
          class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted-foreground transition-colors group-focus-within:text-accent"
        />
        <input
          hlmInput
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="Create a password"
          class="h-12 bg-background/50 px-11"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
        <button
          type="button"
          (click)="showPassword.set(!showPassword())"
          class="absolute right-3.5 top-1/2 -translate-y-1/2 text-muted-foreground transition-colors hover:text-foreground"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          <ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'" size="18" />
        </button>
      </div>

      @if (password().length > 0) {
        <div class="space-y-2 pt-1 animate-fade-in">
          <div class="flex gap-1.5">
            @for (bar of [0, 1, 2, 3]; track bar) {
              <span
                class="h-1.5 flex-1 rounded-full transition-all duration-500"
                [class]="
                  bar < strength()
                    ? strength() <= 1
                      ? 'bg-destructive'
                      : strength() === 2
                        ? 'bg-amber-500'
                        : 'bg-emerald-500'
                    : 'bg-border'
                "
              ></span>
            }
          </div>
          <p class="text-xs text-muted-foreground">
            Strength: <span class="font-medium text-foreground">{{ strengthLabel() }}</span>
          </p>
        </div>
      }
    </div>

    <label
      class="flex cursor-pointer select-none items-start gap-2 text-sm text-muted-foreground animate-fade-up delay-500"
    >
      <input
        type="checkbox"
        class="mt-0.5 h-4 w-4 rounded border-input accent-accent"
        [ngModel]="agree()"
        (ngModelChange)="agree.set($event)"
        name="agree"
      />
      <span>
        I agree to Nova's
        <a routerLink="/terms" class="font-medium text-accent hover:underline">Terms</a> and
        <a routerLink="/privacy" class="font-medium text-accent hover:underline">Privacy Policy</a>.
      </span>
    </label>

    <button
      hlmBtn
      type="submit"
      size="lg"
      class="group relative h-12 w-full overflow-hidden bg-gradient-to-r from-accent via-accent to-amber-500 bg-[length:200%_auto] text-accent-foreground shadow-lg shadow-accent/25 transition-all hover:bg-[position:right_center] hover:shadow-xl hover:shadow-accent/30 animate-fade-up delay-700"
      [disabled]="!canSubmit()"
    >
      @if (loading()) {
        <span class="h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
        Creating account…
      } @else {
        Create account
        <ng-icon name="lucideArrowRight" size="18" class="transition-transform group-hover:translate-x-1" />
      }
    </button>
  </form>
</app-auth-shell>
