<div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">Your wishlist</h1>
      <p class="mt-1 text-sm text-muted-foreground">{{ wishlist.count() }} saved items</p>
    </div>
    @if (wishlist.count() > 0) {
      <div class="flex gap-2">
        <button hlmBtn variant="outline" (click)="wishlist.clear()">Clear all</button>
        <button hlmBtn (click)="addAll()">
          <ng-icon name="lucideShoppingBag" size="16" /> Add all to cart
        </button>
      </div>
    }
  </div>

  @if (wishlist.count() === 0) {
    <div
      class="mt-10 flex flex-col items-center justify-center rounded-2xl border border-dashed border-border py-24 text-center"
    >
      <span class="flex h-16 w-16 items-center justify-center rounded-full bg-secondary">
        <ng-icon name="lucideHeart" size="30" class="text-muted-foreground" />
      </span>
      <h2 class="mt-5 text-lg font-semibold">No saved items yet</h2>
      <p class="mt-1 max-w-xs text-sm text-muted-foreground">
        Tap the heart on any product to save it here for later.
      </p>
      <a hlmBtn class="mt-6" routerLink="/catalog">
        Explore products <ng-icon name="lucideArrowRight" size="16" />
      </a>
    </div>
  } @else {
    <div class="mt-8 grid grid-cols-2 gap-4 sm:gap-6 lg:grid-cols-4">
      @for (product of wishlist.items(); track product.id; let i = $index) {
        <div class="animate-fade-up" [style.animation-delay.ms]="i * 50">
          <app-product-card [product]="product" />
        </div>
      }
    </div>
  }
</div>
